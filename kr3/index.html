<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Для Android -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#704af7">

    <!-- Для iOS (иконка на домашний экран) -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">

    <!-- Для iOS (статус бар) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Favicon для браузера -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <title>Заметки</title>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <header class="app-header">
        <h1>Мои заметки</h1>
        <nav class="tabs  is-center">
            <button id="home-btn" class="tab active col-6">Главная</button>
            <button id="about-btn" class="tab col-6">О приложении</button>
        </nav>
    </header>

    <main id="app-content" class="container" style="margin-top: 2rem;"></main>

    <script src="app.js"></script>
</body>

</html>
