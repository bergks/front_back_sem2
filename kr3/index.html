<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Для Android -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#704af7">

    <!-- Для iOS (иконка на домашний экран) -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">

    <!-- Для iOS (статус бар) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Favicon для браузера -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <title>Заметки</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Мои заметки</h1>
    <form id="note-form" class="row">
        <input class="col-9" type="text" id="note-input" placeholder="Введите заметку" required>
        <button class="col-3" type="submit">+ Добавить</button>
    </form>
    <ul id="notes-list"></ul>
    <script src="app.js"></script>
</body>

</html>
